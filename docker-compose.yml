# NovelCheck — single container. Tuned for TrueNAS SCALE / Linux hosts:
#   * /data    -> SSD dataset (novelcheck.db, small and write-heavy)
#   * /calibre -> folder containing your Calibre library (HDD pool), READ-ONLY.
#                 It can be a parent folder: pick the exact library in
#                 Admin -> Calibre Library.
# On first visit the web page asks you to create the admin account.
services:
  novelcheck:
    image: ghcr.io/zachcurry13/novelcheck:latest   # prebuilt by GitHub Actions
    # build: .                                     # uncomment to build from source instead
    container_name: novelcheck
    restart: unless-stopped
    user: "568:568"            # TrueNAS "apps" user; must be able to read the Calibre library
    ports:
      - "8080:8080"
    environment:
      NOVELCHECK_TRUST_PROXY: "true"                              # honor CF-Connecting-IP / X-Forwarded-For
      NOVELCHECK_CORS_ORIGINS: ""                                 # comma-separated; blank = same-origin only
      NOVELCHECK_SESSION_DAYS: "30"
      TZ: America/Chicago
    volumes:
      - /mnt/ssd/novelcheck:/data                  # change to your SSD dataset
      - /mnt/red14/plex:/calibre:ro                # change to the folder containing your library

  # Optional: expose NovelCheck through a Cloudflare Tunnel (no open ports).
  # Create a tunnel in Cloudflare Zero Trust, route it to http://novelcheck:8080,
  # then enable this service with: docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - novelcheck

  # Optional: local LLM with GPU passthrough. Point the Admin panel's base URL
  # at http://ollama:11434/v1 and model at llama3.2.
  # Enable with: docker compose --profile ollama up -d
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - /mnt/ssd/ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
