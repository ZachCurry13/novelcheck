<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NovelCheck</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body>
<header>
  <button id="navbtn">☰ Menu</button>
  <button id="report" class="sync">Sync now</button>
  <div class="mid"><h1 id="title">NovelCheck</h1><span id="synced" class="meta"></span></div>
</header>
<p id="status" class="meta" hidden></p>
<p id="note"></p>
<section id="menu" hidden>
  <div class="brand"><img id="logo" src="logo.png" alt=""><div><h1>NovelCheck</h1><span id="ver" class="meta"></span><br><span id="who" class="meta"></span></div></div>
  <button id="update" class="main" hidden></button>
  <form id="find"><input id="q" type="text" placeholder="Title or author"><button>Search</button></form>
  <div class="tabs menutabs"><button data-list="up-next">Nightstand</button><button data-list="new">New</button><button data-list="discover">Discover</button><button data-list="collections">Collections</button><button data-list="kindle-mine">My Kindle</button></div>
  <div class="tabs menutabs tools"><p class="meta">This Kindle</p>
    <button id="t-backup">Back up my books to NovelCheck</button><button id="t-restore">Restore books from NovelCheck</button><button id="t-crash">Delete crash logs</button><button id="t-hidden">Books I hid</button><button id="t-dest"></button><p id="lastbk" class="meta"></p></div>
  <p class="help"><button id="check" class="small">Something not working? Send a check</button></p>
</section>
<section id="signin" hidden>
  <div class="brand"><img src="logo.png" alt=""><div><h1>NovelCheck</h1><span class="meta">Sign in to start</span></div></div>
  <p><input id="si-server" type="text" placeholder="NovelCheck's address" autocapitalize="none"></p>
  <p><input id="si-user" type="text" placeholder="Your NovelCheck name" autocapitalize="none"></p>
  <p><input id="si-pass" type="password" placeholder="Your password"></p>
  <p><input id="si-device" type="text" placeholder="A name for this Kindle (optional)"></p>
  <p><button id="si-go" class="main">Sign in</button></p>
  <p id="si-msg" class="meta"></p>
</section>
<section id="lists">
  <div id="filters"><div class="tabs pills"><button id="sortbtn" class="sort">Sort: Recent</button><span class="meta">Spice level:</span> <button data-lvl="">All</button><button data-lvl="0">0</button><button data-lvl="1">1</button><button data-lvl="2">2</button><button data-lvl="3">3</button><button data-lvl="4">4</button><button data-lvl="5">5</button></div>
  <p class="tabs"><button id="dlall" hidden>Download all of my Nightstand</button></p></div>
  <main id="main"></main>
  <footer id="pages"><button id="prev">Prev</button><span id="page"></span><button id="next">Next</button></footer>
</section>
<div id="pager"><button id="pgup" aria-label="Page up">▲</button><button id="pgdn" aria-label="Page down">▼</button></div>
<script src="kindle.js"></script>
<script src="cache.js"></script>
<script src="update.js"></script>
<script src="sync.js"></script>
<script src="tools.js"></script>
<script src="bookpage.js"></script>
<script src="layout.js"></script>
<script src="signin.js"></script>
<script src="app.js"></script>
</body>
</html>
